<!DOCTYPE html>
<html>
<head>
<style>
  :root {
    --primary: #6c63ff;
    --secondary: #ff6584;
    --radius: 12px;
  }
  body {
    font-family: sans-serif;
    padding: 20px;
    background: #f5f5f5;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
  }
  .shape {
    width: 100px; height: 100px;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 12px;
    font-weight: bold;
    text-align: center;
  }
  .kotak { border-radius: var(--radius); }
  .lingkaran { border-radius: 50%; background: var(--secondary); }
  .pil { width: 140px; height: 50px; border-radius: 999px; background: #43e97b; color: #000; }
  .blob { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; background: #f59e0b; }
  .asim { border-radius: 30px 5px 30px 5px; }
</style>
</head>
<body>
  <div class="shape kotak">Rounded</div>
  <div class="shape lingkaran">Circle</div>
  <div class="shape pil">Pill Shape</div>
  <div class="shape blob">Blob</div>
  <div class="shape asim">Asimetris</div>
</body>
</html>
