<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tugas 2 - Flexbox</title>
<style>
body {
  margin: 0;
  font-family: Arial;
}
.navbar {
  display: flex;
  justify-content: space-between;
  background: #333;
  color: white;
  padding: 15px;
}
.hero {
  display: flex;
  padding: 50px;
  align-items: center;
}

.hero img {
  width: 200px;
}
.cards {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  padding: 20px;
}

.card {
  flex: 1 1 200px;
  background: #eee;
  padding: 20px;
  border-radius: 10px;
}
.footer {
  display: flex;
  gap: 20px;
  background: #333;
  color: white;
  padding: 20px;
}

@media (max-width: 600px) {
  .hero {
    flex-direction: column;
  }

  .footer {
    flex-direction: column;
  }
}
</style>
</head>
<body>

<div class="navbar">
  <div>Logo</div>
  <div>Menu</div>
</div>

<div class="hero">
  <div>
    <h1>Welcome</h1>
    <p>Ini landing page sederhana</p>
  </div>
  <img src="https://i.pinimg.com/736x/8e/a5/cc/8ea5cc3d42bd8a58c93256f89bfca14c.jpg">
</div>

<div class="cards">
  <div class="card">Card 1</div>
  <div class="card">Card 2</div>
  <div class="card">Card 3</div>
</div>

<div class="footer">
  <div>Kolom 1</div>
  <div>Kolom 2</div>
  <div>Kolom 3</div>
</div>

</body>
</html>
