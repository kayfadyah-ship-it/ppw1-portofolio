<html>
    <head>
        <title>Latihan8: List Bersarang dan list desinisi</title>
    </head>

    <body>
        <h4>Sebuah list bersarang:</h4>
        <ul>
            <li>kopi</li>
            <li>teh
                <ul>
                    <li>teh hijau</li>
                    <li>teh hitam</li>
                </ul>
            </li>
            <li>susu</li>
        </ul>
        <br>
        <h4>Contoh list definisi:</h4>
        <dl>
            <dt>kopi</dt>
            <dd>minuman panas hitam</dd>
            <dt>susu</dt>
            <dd>minuan dingin putih</dd>
        </dl>
    </body>
</html>
