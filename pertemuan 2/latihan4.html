<html>
    <head>
        <title>Latihan 4: Pemformatan Teks</title>
    </head>
    <body>
        <b> Jadi teks ini akan berformat tebal.</b>
        <br>
        <strong> Teks ini juga tebal.</strong>
        <br>
        <big> Trus teks ini hurufnya akan besar. </big>
        <br>
        <em> Teks ini akan miring.</em>
        <br>
        <i>teks ini juga miring.</i>
        <br>
        <small>Teks ini hurufnya akan kecil.</small>
        <br>
        Teks ini berisi <sub> subscript</sub>
        <br>
        Teks ini berisi <sup> superscript</sup>
    </body>
</html>
