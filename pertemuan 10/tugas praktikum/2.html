<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendataan Praktikan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">Form Pendataan Praktikan</h2>

    <div id="hasil"></div>
</div>
<script>
    let mahasiswa = confirm("Apakah Anda mahasiswa PPW1?");
    if (mahasiswa) {
        let nama = prompt("Masukkan Nama:");
        let nim = prompt("Masukkan NIM:");
        let angkatan = prompt("Masukkan Angkatan:");

        let tahunSekarang = 2026;
        let tahunLulus = parseInt(angkatan) + 4;
        let sisaTahun = tahunLulus - tahunSekarang;
        let statusNim;

        if (nim % 2 == 0) {
            statusNim = "Genap";
        } else {
            statusNim = "Ganjil";
        }
        document.getElementById("hasil").innerHTML = `
        <table class="table table-bordered table-striped">
            <tr>
                <th>Nama</th>
                <td>${nama}</td>
            </tr>
            <tr>
                <th>NIM</th>
                <td>${nim}</td>
            </tr>
            <tr>
                <th>Angkatan</th>
                <td>${angkatan}</td>
            </tr>
            <tr>
                <th>Status NIM</th>
                <td>${statusNim}</td>
            </tr>
            <tr>
                <th>Perkiraan Lulus</th>
                <td>${sisaTahun} tahun lagi</td>
            </tr>
        </table>
        `;
    }
    else {
        document.getElementById("hasil").innerHTML = `
            <div class="alert alert-danger">
                Maaf 😎 <br>
                Hanya mahasiswa PPW1 yang dapat mengakses halaman ini.
            </div>
        `;
    }
</script>
</body>
</html>
