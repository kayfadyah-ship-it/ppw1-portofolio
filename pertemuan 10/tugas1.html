<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Praktikum JavaScript</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- JavaScript Eksternal -->
    <script src="script.js"></script>
</head>
<body class="container mt-4">

    <h1 class="text-center mb-4">Tugas Praktikum JavaScript</h1>

    <!-- Tempat output innerHTML -->
    <div id="hasil" class="mb-4"></div>

    <!-- ================= EMBED JAVASCRIPT ================= -->
    <script>
        // Output menggunakan console.log
        console.log("Ini output dari EMBED JavaScript");

        // Output menggunakan document.write
        document.write("<h3>Halo dari document.write (Embed JS)</h3>");
    </script>

    <!-- ================= INLINE JAVASCRIPT ================= -->
    <button class="btn btn-primary mb-4"
        onclick="alert('Ini output dari INLINE JavaScript menggunakan alert()')">
        Klik Inline JavaScript
    </button>

    <hr>

    <h2>Form Pendataan Praktikan</h2>

    <script>
        // confirm untuk mengecek mahasiswa PPW1
        let statusMahasiswa = confirm("Apakah Anda mahasiswa PPW1?");

        if (statusMahasiswa) {

            // input data menggunakan prompt
            let nama = prompt("Masukkan Nama:");
            let nim = prompt("Masukkan NIM:");
            let angkatan = prompt("Masukkan Angkatan:");

            // tahun sekarang
            let tahunSekarang = new Date().getFullYear();

            // hitung perkiraan lulus
            let tahunLulus = parseInt(angkatan) + 4;
            let sisaTahun = tahunLulus - tahunSekarang;

            // cek genap atau ganjil
            let tipeNim = (nim % 2 == 0) ? "Genap" : "Ganjil";

            // tampilkan data menggunakan innerHTML
            document.getElementById("hasil").innerHTML = `
                <table class="table table-bordered table-striped">
                    <tr>
                        <th>Nama</th>
                        <td>${nama}</td>
                    </tr>
                    <tr>
                        <th>NIM</th>
                        <td>${nim}</td>
                    </tr>
                    <tr>
                        <th>Angkatan</th>
                        <td>${angkatan}</td>
                    </tr>
                    <tr>
                        <th>Status NIM</th>
                        <td>${tipeNim}</td>
                    </tr>
                    <tr>
                        <th>Perkiraan Lulus</th>
                        <td>${tahunLulus}</td>
                    </tr>
                    <tr>
                        <th>Sisa Tahun Menuju Lulus</th>
                        <td>${sisaTahun} tahun lagi</td>
                    </tr>
                </table>
            `;

        } else {

            // pesan penolakan kreatif
            document.getElementById("hasil").innerHTML = `
                <div class="alert alert-danger">
                    🚫 Akses ditolak! <br>
                    Hanya pejuang PPW1 yang boleh masuk ke area ini 😎
                </div>
            `;
        }
    </script>

</body>
</html>
