<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive landing page</title>
    <style>
        nav{
            background-color: rgb(66, 66, 66);
            padding: 15px;
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        nav ul{
            display: flex;
            gap: 25px;
            list-style: none;
            padding: 0;
            margin: 0;
            color: white;
            text-decoration: none;
        }

        .hero img {
            max-width: 100%;
            margin: 0 auto;
            object-fit: cover;
            height: auto;
            display: block;
        }

        .grid {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .card{
            background-color: bisque;
            padding: 10px;
            text-align: center;
            flex: 2;
        }

        h1{
            font-size: 24px;
        }

        h2{
            font-size: 20px;
        }

        /* Mobile (≤ 480px) */
        @media (min-width: 320px) and (max-width: 480px) {
            nav ul {
                flex-direction: column;
            }
            .grid {
                flex-direction: column;
            }
            h1 {
                font-size: 18px;
            }
            h2{
                font-size: 16px;
            }
            body {
            background-color: lightgray;
            }
            }
        /* Tablet (481px - 768px) */
        @media (min-width: 481px) and (max-width: 768px) {
            nav ul {
                flex-direction: column;
            }
            .grid {
                flex-direction: column;
            }
            body {
            background-color: lightblue;
            }
            }
        /* Laptop (769px - 1024px) */
        @media (min-width: 769px) and (max-width: 1024px) {
            nav ul {
                flex-direction: row;
            }
            .grid {
                flex-direction: row;
            }
            body {
            background-color: rgb(174, 154, 248);
            }
            }
        /* Desktop (≥ 1025px) */
        @media (min-width: 1025px) {
            nav ul {
                flex-direction: row;
            }
            .grid {
                flex-direction: row;
            }
            body {
            background-color: white;
            }
            }
        
    </style>

    
</head>
<body>
   <header>
        <nav>
            <ul 
            style="
            display: flex;
            justify-content: space-between;
            align-items: center;">
            <li><a href="tugas_praktikum.html">My Responsive Website</a></li>

                <li>
                    <ul 
                    style="
                    display: flex;
                    gap: 10px;">

                        <li><a href="responsive.html">Home</a></li>
                        <li><a href="about.html">About</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </li>
            </ul>
        
        </nav>
   </header> 

   <main>
        <section class="hero">
            <h2 align="center" >Welcome to My Site</h2>
            <p align="center" >This is a fully responsive webpage.</p>
            <img src="https://i.pinimg.com/1200x/29/44/bb/2944bbc0830ab3d4f3b5f976e2ebe359.jpg" alt="background Image">
        </section>
        <section class="grid">
            <div class="card">Card 1</div>
            <div class="card">Card 2</div>
            <div class="card">Card 3</div>
        </section>
    </main>
</body>
</html>
