<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0">
    <title>line-height</title>
    <style>
        p {
            line-height: 5;
        }
    </style>
</head>
<body>
    <p>ini adalah contoh kalimat yang 
        menggunakan fungsi line-height. 
        jadi kalimat ini akan ada jaraknya beda 
        dari yang lain.  </p>
</body>
</html>
