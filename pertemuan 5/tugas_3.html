<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0">
    <title>word spacing</title>
    <style>
        p {
            word-spacing: 40px;
        }
    </style>
</head>
<body>
    <p> ini adalah kalimat yang menggunakan 
        funsi word-spacing.</p>
</body>
</html>
