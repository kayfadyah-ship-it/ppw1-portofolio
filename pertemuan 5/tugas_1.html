<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0">
    <title>text-indent</title>
    <style>
        p {
        text-indent: 40px;
        }
    </style>
</head>
<body>
    <p>ini adalah contoh kalimat yang menggunakan 
    fungsi text-indent. jadi kalimat ini akan 
    menjorok kedalam ketika pada awal kata.fungsi ini
    bisa digunakan sebagai sebuah pafagraf.</p>
</body>
</html>
