<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>output</title>
</head>
<body>
    <form oninput="hasil.value=parseInt(a.value)+parseInt(b.value)">
    Nilai A: <input type="number" id="a" value="0"><br><br>
    Nilai B: <input type="number" id="b" value="0"><br><br>
    Hasil Penjumlahan:
    <output name="hasil">0</output>
    </form>
</body>
</html>
