<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>data list</title>
</head>
<body>
    <form>
        Pilih jurusan:
        <input list="jurusan">

        <datalist id="jurusan">
            <option value="Informatika">
            <option value="Sistem Informasi">
            <option value="Teknik Komputer">
            <option value="Teknik Elektro">
        </datalist>
    </form>
</body>
</html>
